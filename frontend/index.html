<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CHIPd — AI Hardware Design</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app">

    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-mark">
                C
            </div>

            <div>
                <div class="brand-name">
                    CHIPd
                </div>

                <div class="brand-subtitle">
                    AI Hardware Design
                </div>
            </div>

        </div>


        <nav class="navigation">

            <div class="nav-section">
                WORKSPACE
            </div>


            <button
                class="nav-item active"
                data-page="dashboard"
            >
                <span class="nav-icon">⌂</span>
                <span>Overview</span>
            </button>


            <button
                class="nav-item"
                data-page="projects"
            >
                <span class="nav-icon">▦</span>
                <span>Projects</span>
            </button>


            <button
                class="nav-item"
                data-page="design"
            >
                <span class="nav-icon">◇</span>
                <span>Designs</span>
            </button>


            <button
                class="nav-item"
                data-page="verification"
            >
                <span class="nav-icon">✓</span>
                <span>Verification</span>
            </button>


            <button
                class="nav-item disabled"
                data-page="optimization"
            >
                <span class="nav-icon">↗</span>
                <span>Optimization</span>

                <span class="coming-soon">
                    Soon
                </span>
            </button>


            <button
                class="nav-item"
                data-page="analysis"
            >
                <span class="nav-icon">◈</span>
                <span>Analysis</span>
            </button>


            <div class="nav-divider"></div>


            <div class="nav-section">
                SYSTEM
            </div>


            <button
                class="nav-item"
                data-page="settings"
            >
                <span class="nav-icon">⚙</span>
                <span>Settings</span>
            </button>

        </nav>


        <div class="sidebar-footer">

            <div class="connection-status">

                <span class="status-dot"></span>

                <div>

                    <div class="connection-title">
                        Local Engine
                    </div>

                    <div class="connection-subtitle">
                        Ready
                    </div>

                </div>

            </div>

        </div>

    </aside>


    <!-- =========================================
         MAIN APPLICATION
    ========================================== -->

    <main class="main">

        <!-- TOPBAR -->

        <header class="topbar">

            <div
                class="breadcrumb"
                id="breadcrumb"
            >
                Overview
            </div>


            <div class="topbar-actions">

                <div class="backend-status">

                    <span class="status-dot"></span>

                    Backend connected

                </div>


                <button class="icon-button">
                    ?
                </button>


                <div class="avatar">
                    P2
                </div>

            </div>

        </header>


        <!-- PAGE CONTENT -->

        <section
            class="page"
            id="page-container"
        >

        </section>

    </main>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="api-client.js"></script>

<script src="components/sidebar.js"></script>
<script src="components/topbar.js"></script>
<script src="components/project-card.js"></script>
<script src="components/status-badge.js"></script>
<script src="components/code-viewer.js"></script>
<script src="components/verification-panel.js"></script>
<script src="components/analysis-panel.js"></script>
<script src="components/timeline.js"></script>

<script src="pages/dashboard.js"></script>
<script src="pages/projects.js"></script>
<script src="pages/design.js"></script>
<script src="pages/verification.js"></script>
<script src="pages/settings.js"></script>


<script>

    /*
     * ==========================================
     * CHIPd FRONTEND ROUTER
     * ==========================================
     */

    const pages = {

        dashboard: {
            title: "Overview",
            render: renderDashboard
        },

        projects: {
            title: "Projects",
            render: renderProjects
        },

        design: {
            title: "Design Workspace",
            render: renderDesign
        },

        verification: {
            title: "Verification",
            render: renderVerification
        },

        settings: {
            title: "Settings",
            render: renderSettings
        },

        analysis: {
            title: "Analysis",
            render: () => {

                return `
                    <div class="page-header">
                        <div>
                            <div class="eyebrow">
                                ENGINEERING INSIGHTS
                            </div>

                            <h1>
                                Analysis
                            </h1>

                            <p>
                                Understand verification failures
                                and AI-generated fixes.
                            </p>
                        </div>
                    </div>

                    <div class="panel page-placeholder">

                        <div class="empty-state">

                            <div class="empty-icon">
                                ◈
                            </div>

                            <h3>
                                Analysis workspace
                            </h3>

                            <p>
                                AI failure analysis will appear here
                                after a verification run.
                            </p>

                        </div>

                    </div>
                `;
            }
        }

    };


    /*
     * ==========================================
     * PAGE NAVIGATION
     * ==========================================
     */

    function navigate(pageName) {

        const page = pages[pageName];

        if (!page) {
            return;
        }


        const container =
            document.getElementById("page-container");


        const breadcrumb =
            document.getElementById("breadcrumb");


        /*
         * Update active sidebar item
         */

        document
            .querySelectorAll(".nav-item")
            .forEach(item => {

                item.classList.toggle(
                    "active",
                    item.dataset.page === pageName
                );

            });


        /*
         * Update breadcrumb
         */

        breadcrumb.textContent = page.title;


        /*
         * Render page
         */

        container.innerHTML = page.render();


        /*
         * Update browser URL without reload
         */

        history.pushState(
            { page: pageName },
            "",
            `#${pageName}`
        );


        /*
         * Initialize page-specific functionality
         */

        if (
            typeof initializePage === "function"
        ) {
            initializePage(pageName);
        }

    }


    /*
     * ==========================================
     * SIDEBAR EVENTS
     * ==========================================
     */

    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    const page =
                        item.dataset.page;

                    if (
                        page &&
                        pages[page]
                    ) {
                        navigate(page);
                    }

                }
            );

        });


    /*
     * ==========================================
     * INITIAL PAGE
     * ==========================================
     */

    const initialPage =
        window.location.hash
            .replace("#", "")
            || "dashboard";


    navigate(
        pages[initialPage]
            ? initialPage
            : "dashboard"
    );


    /*
     * ==========================================
     * BROWSER BACK / FORWARD
     * ==========================================
     */

    window.addEventListener(
        "popstate",
        () => {

            const page =
                window.location.hash
                    .replace("#", "")
                    || "dashboard";

            navigate(
                pages[page]
                    ? page
                    : "dashboard"
            );

        }
    );

</script>

</body>

</html>
